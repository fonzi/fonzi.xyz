name: Build On Push And Deploy
on:
  push:
    branches:
      - 'main'   # main only
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true   # theme

    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.163.3'   # keep in sync with .hvm
        extended: true

    - name: Build
      run: make prod-build PROD_DIR=public

    - name: Update repo on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        script: |
          cd /var/www/jukebox
          git fetch origin main
          git reset --hard origin/main

    - name: Upload built site
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        source: public
        target: /var/www/jukebox/public
        strip_components: 1
        rm: true   # wipe old build so deleted pages don't linger
